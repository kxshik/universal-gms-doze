<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Universal GMS Doze (Debug)</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap');

  :root {
    --md-sys-color-background: #101318;
    --md-sys-color-surface: #101318;
    --md-sys-color-surface-container-lowest: #0b0e12;
    --md-sys-color-surface-container-low: #181c22;
    --md-sys-color-surface-container: #1c2026;
    --md-sys-color-surface-container-high: #262b33;
    --md-sys-color-surface-container-highest: #31363f;

    --md-sys-color-primary: #76d89c;
    --md-sys-color-on-primary: #00391c;
    --md-sys-color-primary-container: #00522b;
    --md-sys-color-on-primary-container: #92f5b7;

    --md-sys-color-secondary: #b6ccb8;
    --md-sys-color-secondary-container: #384b3c;
    --md-sys-color-on-secondary-container: #d2e8d4;

    --md-sys-color-tertiary: #a2ced9;
    --md-sys-color-tertiary-container: #204d56;
    --md-sys-color-on-tertiary-container: #beeaf6;

    --md-sys-color-error: #ffb4ab;
    --md-sys-color-on-error: #690005;
    --md-sys-color-error-container: #93000a;
    --md-sys-color-on-error-container: #ffdad6;

    --md-sys-color-on-surface: #e1e2e8;
    --md-sys-color-on-surface-variant: #c1c7ce;
    --md-sys-color-outline: #8b9198;
    --md-sys-color-outline-variant: #41484d;

    --ease-expressive: cubic-bezier(0.2, 0, 0, 1);
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    background: var(--md-sys-color-background);
    color: var(--md-sys-color-on-surface);
    font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 14px;
    line-height: 1.5;
    min-height: 100vh;
    padding: 20px 16px 88px;
  }

  .container {
    max-width: 560px;
    margin: 0 auto;
  }

  header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 20px;
    padding: 4px 2px;
  }

  .brand-wrap {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .title-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .brand-badge {
    width: 36px;
    height: 36px;
    border-radius: 12px;
    background: var(--md-sys-color-primary-container);
    color: var(--md-sys-color-on-primary-container);
    display: grid;
    place-items: center;
    flex-shrink: 0;
  }

  h1 {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: var(--md-sys-color-on-surface);
  }

  .subtitle {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: 500;
    color: var(--md-sys-color-on-surface-variant);
    background: var(--md-sys-color-surface-container);
    padding: 4px 12px;
    border-radius: 9999px;
    width: fit-content;
  }

  .tabs {
    display: flex;
    gap: 6px;
    background: var(--md-sys-color-surface-container);
    padding: 5px;
    border-radius: 9999px;
    margin-bottom: 20px;
  }

  .tab {
    flex: 1;
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    color: var(--md-sys-color-on-surface-variant);
    background: transparent;
    border: none;
    border-radius: 9999px;
    padding: 10px 14px;
    cursor: pointer;
    transition: background-color 0.25s var(--ease-expressive), color 0.25s var(--ease-expressive), transform 0.15s var(--ease-expressive);
  }

  .tab:active { transform: scale(0.97); }

  .tab.active {
    background: var(--md-sys-color-primary-container);
    color: var(--md-sys-color-on-primary-container);
  }

  .tab:hover:not(.active) {
    background: var(--md-sys-color-surface-container-high);
    color: var(--md-sys-color-on-surface);
  }

  .page {
    display: none;
    animation: fadeSlide 0.25s var(--ease-expressive);
  }

  .page.active { display: block; }

  @keyframes fadeSlide {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .status-card {
    background: var(--md-sys-color-surface-container-low);
    border-radius: 28px;
    padding: 22px;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    border: 1px solid rgba(255, 255, 255, 0.04);
    transition: background-color 0.3s var(--ease-expressive);
  }

  .status-card.is-optimized {
    background: linear-gradient(135deg, rgba(0, 82, 43, 0.42), var(--md-sys-color-surface-container-low) 70%);
  }

  .status-card.is-not-optimized {
    background: linear-gradient(135deg, rgba(147, 0, 10, 0.38), var(--md-sys-color-surface-container-low) 70%);
  }

  .status-left {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .status-icon {
    width: 52px;
    height: 52px;
    border-radius: 18px;
    display: grid;
    place-items: center;
    background: var(--md-sys-color-surface-container-high);
    color: var(--md-sys-color-on-surface-variant);
    flex-shrink: 0;
  }

  .status-card.is-optimized .status-icon {
    background: var(--md-sys-color-primary-container);
    color: var(--md-sys-color-on-primary-container);
  }

  .status-card.is-not-optimized .status-icon {
    background: var(--md-sys-color-error-container);
    color: var(--md-sys-color-on-error-container);
  }

  .status-meta {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .status-label {
    font-size: 12px;
    font-weight: 500;
    color: var(--md-sys-color-on-surface-variant);
  }

  .status-value {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.01em;
    color: var(--md-sys-color-on-surface);
  }

  .status-value.optimized { color: var(--md-sys-color-primary); }
  .status-value.not-optimized { color: var(--md-sys-color-error); }
  .status-value.checking { color: var(--md-sys-color-on-surface-variant); }

  .icon-btn {
    width: 44px;
    height: 44px;
    border-radius: 16px;
    border: none;
    background: var(--md-sys-color-surface-container-high);
    color: var(--md-sys-color-on-surface);
    display: grid;
    place-items: center;
    cursor: pointer;
    flex-shrink: 0;
    transition: background-color 0.2s var(--ease-expressive), transform 0.15s var(--ease-expressive);
  }

  .icon-btn:hover { background: var(--md-sys-color-surface-container-highest); }
  .icon-btn:active { transform: scale(0.92); }
  .icon-btn.spinning svg { animation: spin 0.8s linear infinite; }

  @keyframes spin { to { transform: rotate(360deg); } }

  .section-title {
    font-size: 12px;
    font-weight: 600;
    color: var(--md-sys-color-primary);
    letter-spacing: 0.04em;
    text-transform: uppercase;
    margin: 20px 6px 10px;
  }

  .action-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .action-card {
    width: 100%;
    text-align: left;
    background: var(--md-sys-color-surface-container);
    border: 1px solid rgba(255, 255, 255, 0.03);
    border-radius: 22px;
    padding: 16px 18px;
    display: flex;
    align-items: center;
    gap: 14px;
    cursor: pointer;
    color: inherit;
    font-family: inherit;
    transition: background-color 0.2s var(--ease-expressive), transform 0.15s var(--ease-expressive);
  }

  .action-card:hover { background: var(--md-sys-color-surface-container-high); }
  .action-card:active { transform: scale(0.985); }

  .action-icon {
    width: 42px;
    height: 42px;
    border-radius: 14px;
    background: var(--md-sys-color-secondary-container);
    color: var(--md-sys-color-on-secondary-container);
    display: grid;
    place-items: center;
    flex-shrink: 0;
  }

  .action-icon.tertiary {
    background: var(--md-sys-color-tertiary-container);
    color: var(--md-sys-color-on-tertiary-container);
  }

  .action-body { flex: 1; min-width: 0; }

  .action-title {
    font-size: 15px;
    font-weight: 600;
    color: var(--md-sys-color-on-surface);
    margin-bottom: 2px;
  }

  .action-desc {
    font-size: 12px;
    color: var(--md-sys-color-on-surface-variant);
    line-height: 1.4;
  }

  .action-chevron { color: var(--md-sys-color-on-surface-variant); flex-shrink: 0; }

  .output-box {
    display: none;
    margin-top: 16px;
    background: var(--md-sys-color-surface-container-lowest);
    border: 1px solid var(--md-sys-color-outline-variant);
    border-radius: 20px;
    padding: 14px 16px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    line-height: 1.55;
    white-space: pre-wrap;
    word-break: break-word;
    max-height: 320px;
    overflow-y: auto;
  }

  .output-box.visible {
    display: block;
    animation: fadeSlide 0.2s var(--ease-expressive);
  }

  .output-box .ok { color: var(--md-sys-color-primary); }
  .output-box .err { color: var(--md-sys-color-error); }
  .output-box .info { color: var(--md-sys-color-on-surface-variant); }

  .search-wrap {
    position: relative;
    margin-bottom: 14px;
  }

  .search-icon {
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--md-sys-color-on-surface-variant);
    pointer-events: none;
  }

  .search-input {
    width: 100%;
    background: var(--md-sys-color-surface-container-high);
    border: 1px solid transparent;
    border-radius: 28px;
    padding: 13px 18px 13px 46px;
    color: var(--md-sys-color-on-surface);
    font-family: inherit;
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s var(--ease-expressive), background-color 0.2s var(--ease-expressive);
  }

  .search-input::placeholder { color: var(--md-sys-color-on-surface-variant); }
  .search-input:focus {
    border-color: var(--md-sys-color-primary);
    background: var(--md-sys-color-surface-container-highest);
  }

  .app-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .app-item {
    background: var(--md-sys-color-surface-container);
    border-radius: 20px;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    border: 1px solid rgba(255, 255, 255, 0.03);
  }

  .app-item.exempted {
    background: var(--md-sys-color-surface-container-high);
    border-color: rgba(118, 216, 156, 0.22);
  }

  .app-item-info { min-width: 0; flex: 1; }

  .app-item-name {
    font-size: 14px;
    font-weight: 600;
    color: var(--md-sys-color-on-surface);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .app-item-pkg {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--md-sys-color-on-surface-variant);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .app-toggle {
    position: relative;
    width: 52px;
    height: 32px;
    border-radius: 9999px;
    border: 2px solid var(--md-sys-color-outline);
    background: var(--md-sys-color-surface-container-highest);
    cursor: pointer;
    flex-shrink: 0;
    transition: background-color 0.25s var(--ease-expressive), border-color 0.25s var(--ease-expressive);
  }

  .app-toggle::after {
    content: '';
    position: absolute;
    left: 6px;
    top: 50%;
    transform: translateY(-50%);
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--md-sys-color-outline);
    transition: transform 0.25s var(--ease-expressive), width 0.2s var(--ease-expressive), height 0.2s var(--ease-expressive), background-color 0.25s var(--ease-expressive);
  }

  .app-toggle.on {
    background: var(--md-sys-color-primary);
    border-color: var(--md-sys-color-primary);
  }

  .app-toggle.on::after {
    width: 24px;
    height: 24px;
    left: 2px;
    transform: translate(22px, -50%);
    background: var(--md-sys-color-on-primary);
  }

  .app-toggle:disabled { opacity: 0.5; cursor: wait; }

  /* Debug Button Row */
  .btn-row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 14px;
  }

  .tonal-btn {
    flex: 1;
    min-width: 110px;
    border: none;
    border-radius: 9999px;
    padding: 12px 16px;
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    background: var(--md-sys-color-secondary-container);
    color: var(--md-sys-color-on-secondary-container);
    cursor: pointer;
    transition: background-color 0.2s var(--ease-expressive), transform 0.15s var(--ease-expressive);
  }

  .tonal-btn.primary {
    background: var(--md-sys-color-primary-container);
    color: var(--md-sys-color-on-primary-container);
  }

  .tonal-btn.danger {
    background: var(--md-sys-color-error-container);
    color: var(--md-sys-color-on-error-container);
  }

  .tonal-btn:active { transform: scale(0.97); }

  .toast {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: #e1e2e8;
    color: #181c22;
    font-size: 13px;
    font-weight: 600;
    padding: 12px 20px;
    border-radius: 16px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    opacity: 0;
    pointer-events: none;
    transition: transform 0.3s var(--ease-expressive), opacity 0.3s var(--ease-expressive);
    z-index: 1000;
    max-width: calc(100vw - 32px);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="brand-wrap">
      <div class="title-row">
        <div class="brand-badge">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            <path d="m9 12 2 2 4-4"/>
          </svg>
        </div>
        <h1>Universal GMS Doze</h1>
      </div>
      <div class="subtitle" id="subtitle">Loading...</div>
    </div>
  </header>

  <nav class="tabs" role="tablist">
    <button class="tab active" onclick="switchTab('overview', this)">Overview</button>
    <button class="tab" onclick="switchTab('exemptions', this)">Exemptions</button>
    <button class="tab" onclick="switchTab('debug', this)">Debug</button>
  </nav>

  <!-- Overview Page -->
  <section class="page active" id="page-overview">
    <div class="status-card" id="statusCard">
      <div class="status-left">
        <div class="status-icon" id="statusIcon">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <path d="M12 6v6l4 2"/>
          </svg>
        </div>
        <div class="status-meta">
          <span class="status-label">Google Play Services</span>
          <span class="status-value checking" id="statusValue">Checking...</span>
        </div>
      </div>
      <button class="icon-btn" id="refreshBtn" onclick="checkStatus()" title="Refresh status" aria-label="Refresh status">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/>
          <path d="M21 3v5h-5"/>
        </svg>
      </button>
    </div>

    <div class="section-title">Quick Actions</div>
    <div class="action-list">
      <button class="action-card" onclick="runAction('force_doze')">
        <div class="action-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/>
          </svg>
        </div>
        <div class="action-body">
          <div class="action-title">Force GMS Doze</div>
          <div class="action-desc">Remove com.google.android.gms from deviceidle whitelist</div>
        </div>
        <svg class="action-chevron" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
      </button>

      <button class="action-card" onclick="runAction('fix_messages')">
        <div class="action-icon tertiary">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>
          </svg>
        </div>
        <div class="action-body">
          <div class="action-title">Clear GMS Cache</div>
          <div class="action-desc">Delete cached GMS files in /data/data to fix delayed notifications</div>
        </div>
        <svg class="action-chevron" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
      </button>

      <button class="action-card" id="fmdBtn" onclick="toggleFmd()">
        <div class="action-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/>
          </svg>
        </div>
        <div class="action-body">
          <div class="action-title" id="fmdTitle">Find My Device</div>
          <div class="action-desc" id="fmdDesc">Checking MdmDeviceAdminReceiver state...</div>
        </div>
        <svg class="action-chevron" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
      </button>
    </div>

    <div class="output-box" id="output"></div>
  </section>

  <!-- Exemptions Page -->
  <section class="page" id="page-exemptions">
    <div class="search-wrap">
      <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>
      </svg>
      <input type="text" class="search-input" id="appSearch" placeholder="Search installed apps..." oninput="filterApps()">
    </div>
    <div class="app-list" id="appList">
      <div style="color:var(--md-sys-color-on-surface-variant);font-size:13px;padding:12px;">Loading apps...</div>
    </div>
  </section>

  <!-- Debug Page -->
  <section class="page" id="page-debug">
    <div class="btn-row">
      <button class="tonal-btn primary" onclick="viewDebugLog()">View Log</button>
      <button class="tonal-btn" onclick="exportDebugLog()">Export to /sdcard</button>
      <button class="tonal-btn danger" onclick="clearDebugLog()">Clear Log</button>
    </div>
    <div class="output-box" id="debugLog"></div>
  </section>
</div>

<div class="toast" id="toast"></div>

<script>
const MOD = '/data/adb/modules/universal-gms-doze';
const CONFIG = `${MOD}/exemptions.conf`;

function exec(cmd) {
  return new Promise((resolve, reject) => {
    if (typeof ksu !== 'undefined' && ksu.exec) {
      const cb = 'cb_' + Date.now() + '_' + Math.random().toString(36).slice(2);
      window[cb] = (errno, stdout, stderr) => {
        delete window[cb];
        resolve({ errno, stdout: stdout || '', stderr: stderr || '' });
      };
      ksu.exec(cmd, '{}', cb);
    } else {
      reject('KernelSU WebUI API not available');
    }
  });
}

function escapeHtml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
}

window.switchTab = function(name, btn) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('page-' + name).classList.add('active');
  if (name === 'exemptions' && allApps.length === 0) loadApps();
};

window.checkStatus = async function() {
  const btn = document.getElementById('refreshBtn');
  const val = document.getElementById('statusValue');
  const card = document.getElementById('statusCard');
  const icon = document.getElementById('statusIcon');
  btn.classList.add('spinning');
  val.className = 'status-value checking';
  val.textContent = 'Checking...';
  card.classList.remove('is-optimized', 'is-not-optimized');
  try {
    const { stdout } = await exec('dumpsys deviceidle whitelist | grep -E "com\\.google\\.android\\.gms([^.]|$)"');
    const optimized = stdout.trim() === '';
    val.className = 'status-value ' + (optimized ? 'optimized' : 'not-optimized');
    val.textContent = optimized ? 'Optimized' : 'Not Optimized';
    card.classList.add(optimized ? 'is-optimized' : 'is-not-optimized');
    icon.innerHTML = optimized
      ? '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>'
      : '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>';
  } catch(e) {
    val.className = 'status-value not-optimized';
    val.textContent = 'Error';
    card.classList.add('is-not-optimized');
  }
  btn.classList.remove('spinning');
};

window.runAction = async function(action) {
  const output = document.getElementById('output');
  output.classList.add('visible');
  output.innerHTML = '<span class="info">Running...</span>';
  const commands = {
    fix_messages: "cd /data/data && find . -type f -name '*gms*' -delete && echo 'Done. GMS cache cleared.'",
    force_doze: 'dumpsys deviceidle whitelist -com.google.android.gms 2>&1 && echo "Done."'
  };
  try {
    const { errno, stdout, stderr } = await exec(commands[action]);
    const out = (stdout || '') + (stderr || '');
    output.innerHTML = `<span class="${errno === 0 ? 'ok' : 'err'}">${escapeHtml(out.trim() || 'Done.')}</span>`;
    if (action === 'force_doze') setTimeout(() => window.checkStatus(), 800);
  } catch(e) {
    output.innerHTML = `<span class="err">Error: ${escapeHtml(e)}</span>`;
  }
};

const FMD = 'com.google.android.gms/com.google.android.gms.mdm.receivers.MdmDeviceAdminReceiver';

window.checkFmdStatus = async function() {
  const title = document.getElementById('fmdTitle');
  const desc  = document.getElementById('fmdDesc');
  const btn   = document.getElementById('fmdBtn');
  try {
    const { stdout } = await exec("pm query-receivers --components -a android.app.action.DEVICE_ADMIN_ENABLED 2>/dev/null | grep MdmDeviceAdminReceiver");
    const enabled = stdout.trim() !== '';
    title.textContent = enabled ? 'Disable Find My Device' : 'Enable Find My Device';
    desc.textContent  = enabled ? 'MdmDeviceAdminReceiver is ENABLED — tap to disable (optional)' : 'MdmDeviceAdminReceiver is DISABLED — tap to enable';
    btn.dataset.state = enabled ? 'enabled' : 'disabled';
  } catch(e) { desc.textContent = 'Could not check status'; }
};

window.toggleFmd = async function() {
  const btn    = document.getElementById('fmdBtn');
  const output = document.getElementById('output');
  const state  = btn.dataset.state;
  output.classList.add('visible');
  output.innerHTML = '<span class="info">Running...</span>';
  const cmd = state === 'disabled'
    ? `pm enable ${FMD} 2>&1 && echo "Find My Device enabled."`
    : `pm disable ${FMD} 2>&1 && echo "Find My Device disabled."`;
  try {
    const { errno, stdout, stderr } = await exec(cmd);
    output.innerHTML = `<span class="${errno === 0 ? 'ok' : 'err'}">${escapeHtml((stdout||'')+(stderr||''))}</span>`;
    setTimeout(() => window.checkFmdStatus(), 500);
  } catch(e) { output.innerHTML = `<span class="err">Error: ${escapeHtml(e)}</span>`; }
};

// ── Exemptions page ───────────────────────────────────────────
let allApps = [];

async function loadConfig() {
  const { errno, stdout } = await exec(`cat "${CONFIG}" 2>/dev/null`);
  if (errno !== 0 || !stdout.trim()) return new Set();
  return new Set(stdout.trim().split('\n').filter(Boolean));
}

async function saveConfig(pkgs) {
  const content = [...pkgs].join('\n');
  await exec(`printf '%s' '${content.replace(/'/g,"'\\''")}' > "${CONFIG}" 2>/dev/null`);
}

async function getActiveExemptions() {
  const { stdout } = await exec('dumpsys deviceidle whitelist 2>/dev/null | grep "^user," | cut -d, -f2');
  return new Set(stdout.trim().split('\n').filter(Boolean));
}

async function loadApps() {
  const list = document.getElementById('appList');
  try {
    const [pkgsRes, saved, active] = await Promise.all([
      exec('pm list packages -3 2>/dev/null'),
      loadConfig(),
      getActiveExemptions()
    ]);

    const pkgs = pkgsRes.stdout.trim().split('\n')
      .map(l => l.replace('package:', '').trim())
      .filter(Boolean)
      .sort();

    allApps = pkgs.map(pkg => ({ pkg, exempted: saved.has(pkg) || active.has(pkg) }));
    allApps.sort((a, b) => (b.exempted ? 1 : 0) - (a.exempted ? 1 : 0));
    renderApps(allApps);
  } catch(e) {
    list.innerHTML = `<div style="color:var(--md-sys-color-error);font-size:12px;padding:12px;">Error: ${escapeHtml(e)}</div>`;
  }
}

function renderApps(apps) {
  const list = document.getElementById('appList');
  if (!apps.length) {
    list.innerHTML = '<div style="color:var(--md-sys-color-on-surface-variant);font-size:12px;padding:12px;">No apps found</div>';
    return;
  }
  list.innerHTML = apps.map(({ pkg, exempted }) => {
    const safePkg = pkg.replace(/'/g, "\\'");
    return `
    <div class="app-item ${exempted ? 'exempted' : ''}" id="app-${CSS.escape(pkg)}">
      <div class="app-item-info">
        <div class="app-item-name">${escapeHtml(pkg.split('.').pop())}</div>
        <div class="app-item-pkg">${escapeHtml(pkg)}</div>
      </div>
      <button class="app-toggle ${exempted ? 'on' : ''}" onclick="toggleApp('${safePkg}', this)"></button>
    </div>`;
  }).join('');
}

window.filterApps = function() {
  const q = document.getElementById('appSearch').value.toLowerCase();
  renderApps(q ? allApps.filter(a => a.pkg.toLowerCase().includes(q)) : allApps);
};

window.toggleApp = async function(pkg, btn) {
  const item = document.getElementById('app-' + CSS.escape(pkg));
  const app  = allApps.find(a => a.pkg === pkg);
  if (!app) return;
  btn.disabled = true;
  const adding = !app.exempted;
  try {
    if (adding) {
      await exec(`dumpsys deviceidle whitelist +${pkg} 2>/dev/null`);
      await exec(`cmd appops set ${pkg} RUN_IN_BACKGROUND allow 2>/dev/null`);
      await exec(`cmd appops set ${pkg} RUN_ANY_IN_BACKGROUND allow 2>/dev/null`);
    } else {
      await exec(`dumpsys deviceidle whitelist -${pkg} 2>/dev/null`);
      await exec(`cmd appops set ${pkg} RUN_IN_BACKGROUND default 2>/dev/null`);
      await exec(`cmd appops set ${pkg} RUN_ANY_IN_BACKGROUND default 2>/dev/null`);
    }
    app.exempted = adding;
    btn.classList.toggle('on', adding);
    item.classList.toggle('exempted', adding);
    const exempted = new Set(allApps.filter(a => a.exempted).map(a => a.pkg));
    await saveConfig(exempted);
    await exec("cd /data/data && find . -type f -name '*gms*' -delete 2>/dev/null");
    toast(adding ? `${pkg} exempted` : `${pkg} restored`);
  } catch(e) { toast('Error: ' + e); }
  btn.disabled = false;
};

// ── Init ──────────────────────────────────────────────────────
window.checkStatus();
window.checkFmdStatus();

(async function() {
  try {
    const { stdout } = await exec(`grep -E '^version=|^maintainer=' ${MOD}/module.prop 2>/dev/null`);
    const version    = (stdout.match(/^version=(.+)/m) || [])[1] || '';
    const maintainer = (stdout.match(/^maintainer=(.+)/m) || [])[1] || '';
    const parts = [];
    if (version)    parts.push('v' + version.trim() + '-debug');
    if (maintainer) parts.push('maintainer: ' + maintainer.trim());
    document.getElementById('subtitle').textContent = parts.join(' · ') || 'Universal GMS Doze';
  } catch(e) { document.getElementById('subtitle').textContent = 'Universal GMS Doze'; }
})();

const DEBUG_LOG = '/data/adb/ugd_debug.log';

window.viewDebugLog = async function() {
  const el = document.getElementById('debugLog');
  el.style.display = 'block';
  el.classList.add('visible');
  el.innerHTML = '<span class="info">Loading...</span>';
  try {
    const { errno, stdout } = await exec('cat "' + DEBUG_LOG + '" 2>/dev/null');
    el.innerHTML = errno !== 0 || !stdout.trim()
      ? '<span class="info">No debug log found. Install debug build and reboot first.</span>'
      : escapeHtml(stdout);
    el.scrollTop = el.scrollHeight;
  } catch(e) { el.innerHTML = '<span class="err">Error: ' + escapeHtml(e) + '</span>'; }
};

window.exportDebugLog = async function() {
  try {
    const dest = '/sdcard/ugd_debug.log';
    const { errno } = await exec('cp "' + DEBUG_LOG + '" "' + dest + '" 2>&1 && echo "Exported to ' + dest + '"');
    toast(errno === 0 ? 'Exported to ' + dest : 'Export failed');
  } catch(e) { toast('Error: ' + e); }
};

window.clearDebugLog = async function() {
  const el = document.getElementById('debugLog');
  try {
    await exec('rm -f "' + DEBUG_LOG + '" 2>/dev/null');
    el.innerHTML = '';
    el.style.display = 'none';
    el.classList.remove('visible');
    toast('Log cleared.');
  } catch(e) { toast('Error: ' + e); }
};
</script>
